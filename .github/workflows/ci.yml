name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests (including signing vectors)
        run: pytest -q -rs
      - name: Signing vectors must not be skipped in CI
        run: pytest -q -m signing --co -q | grep -q "test_signing_vectors"
