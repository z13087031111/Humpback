name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests (including signing vectors)
        run: pytest -q -rs
      - name: Signing vectors must not be skipped in CI
        run: pytest -q -m signing -rs | tee signing.log && ! grep -q "SKIPPED" signing.log
